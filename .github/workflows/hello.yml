name: Build Image

# Triggers
on:
  push:
    branches:
      - main
      - master
    
permissions: 
  contents: read
  packages: write
    
# jobs
jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Hello World
        run: echo "Hello World"
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: List Directory of Runner
        run: ls -la
        
  docker-image:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./PipelineProcessor.API/Dockerfile
          push: true
          tags: ghcr.io/plashspeed-aiman/stondy-gorup:latest
